name: Bug report
description: Something in courier-bd-sdk does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove credentials, tokens, phone numbers, customer names and other
        private data from anything you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal command, code snippet or input file that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error messages, stack traces or report output.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version from package.json or npm ls courier-bd-sdk
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and runtime version.
      placeholder: Ubuntu 24.04, ...
